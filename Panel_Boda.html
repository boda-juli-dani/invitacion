<html lang="es">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background-color: #17171F; color: #F4F4F6; padding: 22px; }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #2C2C3A; }
    .header h1 { font-size: 22px; font-weight: 700; color: #E5C39E; }
    .search-input { background: #23232E; border: 1px solid #38384A; color: white; padding: 8px 14px; border-radius: 8px; font-size: 13px; width: 240px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .metric-card { background: #20202B; border: 1px solid #313142; border-radius: 12px; padding: 14px 18px; }
    .metric-title { font-size: 11px; color: #9A9AA8; text-transform: uppercase; letter-spacing: 1px; }
    .metric-val { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    .column { background: #1C1C26; border: 1px solid #2B2B38; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; min-height: 480px; }
    .col-header { font-size: 14px; font-weight: 700; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 2px solid; display: flex; justify-content: space-between; }
    .col-confirmed { border-color: #4EAA78; color: #4EAA78; }
    .col-pending { border-color: #E5A84B; color: #E5A84B; }
    .col-exterior { border-color: #60A5FA; color: #60A5FA; }
    .col-rejected { border-color: #E25B5B; color: #E25B5B; }
    .card-list { display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
    .guest-card { background: #252533; border: 1px solid #37374A; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .guest-info { display: flex; justify-content: space-between; align-items: baseline; }
    .guest-name { font-weight: 600; font-size: 14px; }
    .guest-group { font-size: 11px; color: #8F8FA0; }

    /* Input editable de Pases */
    .input-pases {
      background: #333345; border: 1px solid #4A4A5A; border-radius: 4px;
      color: #E5C39E; font-size: 11px; font-weight: 700; width: 38px;
      text-align: center; padding: 2px 4px; outline: none; font-family: inherit;
    }
    .input-pases:focus { border-color: #E5C39E; }
    .guest-badge-text { font-size: 11px; color: #E5C39E; font-weight: 600; }

    .guest-actions { display: flex; gap: 5px; margin-top: 4px; }
    .btn-action { flex: 1; border: none; padding: 6px 0; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-conf { background: #4EAA78; color: white; }
    .btn-pend { background: #E5A84B; color: black; }
    .btn-ext { background: #3B82F6; color: white; }
    .btn-rej { background: #E25B5B; color: white; }
  </style>
</head>
<body>

bre": "Edgar, Susan & nenes", "pases": 4, "grupo": "Exterior (EE. UU.)", "estado": "Exterior"}];
    // Se utiliza 'boda_panel_v20' para forzar la actualización de estructura y no tener bugs
    let invitados = JSON.parse(localStorage.getItem('boda_panel_v20')) || listaInicial;

    // Si abriste la web desde tu celu y confirmaste, esto lo trae al panel.
    const webConfirmados = JSON.parse(localStorage.getItem('boda_asistencia') || '{}');
    let huboCambiosWeb = false;

    Object.values(webConfirmados).forEach(c => {
      const idx = invitados.findIndex(i => i.id === c.id);
      if (idx !== -1) {
        invitados[idx].estado = c.estado;
        invitados[idx].pases = c.pases; // Se actualiza a la cantidad que confirmaron
        huboCambiosWeb = true;
      }
    });

    // Se limpia la boda_asistencia web para que no pise futuras ediciones manuales tuyas
    if (huboCambiosWeb) {
        localStorage.setItem('boda_panel_v20', JSON.stringify(invitados));
        localStorage.removeItem('boda_asistencia');
    }

    function guardar() { localStorage.setItem('boda_panel_v20', JSON.stringify(invitados)); render(); }

    function cambiarEstado(id, nuevoEstado) { const inv = invitados.find(i => i.id === id); if (inv) { inv.estado = nuevoEstado; guardar(); } }

    // Función para editar manualmente la cantidad de personas
    function cambiarPases(id, nuevosPases) {
      const inv = invitados.find(i => i.id === id);
      if (inv) {
        inv.pases = parseInt(nuevosPases) || 0;
        guardar();
      }
    }

    function render() {
      const q = document.getElementById('busqueda').value.toLowerCase();
      const listConf = document.getElementById('listConfirmados'); const listPend = document.getElementById('listPendientes');
      const listExt = document.getElementById('listExterior'); const listRej = document.getElementById('listRechazados');

      listConf.innerHTML = ''; listPend.innerHTML = ''; listExt.innerHTML = ''; listRej.innerHTML = '';
      let totalC = 0, totalP = 0, totalE = 0, totalR = 0;

      invitados.forEach(inv => {
        if (q && !inv.nombre.toLowerCase().includes(q) && !inv.grupo.toLowerCase().includes(q)) return;
        const card = document.createElement('div'); card.className = 'guest-card';
        card.innerHTML = `
          <div class="guest-info">
            <span class="guest-name">${inv.nombre}</span>
            <span style="display:flex; align-items:center; gap:4px;">
              <input type="number" class="input-pases" value="${inv.pases}" min="0" onchange="cambiarPases('${inv.id}', this.value)">
              <span class="guest-badge-text">pases</span>
            </span>
          </div>
          <div class="guest-group">${inv.grupo} · <small>${inv.id}</small></div>
          <div class="guest-actions">
            <button class="btn-action btn-conf" onclick="cambiarEstado('${inv.id}', 'Confirmado')">✓ Confirma</button>
            <button class="btn-action btn-pend" onclick="cambiarEstado('${inv.id}', 'Pendiente')">⏳ Espera</button>
            <button class="btn-action btn-ext" onclick="cambiarEstado('${inv.id}', 'Exterior')">✈️ Ext</button>
            <button class="btn-action btn-rej" onclick="cambiarEstado('${inv.id}', 'Rechazado')">✕ No va</button>
          </div>
        `;
        if (inv.estado === 'Confirmado') { listConf.appendChild(card); totalC += inv.pases; }
        else if (inv.estado === 'Exterior') { listExt.appendChild(card); totalE += inv.pases; }
        else if (inv.estado === 'Rechazado') { listRej.appendChild(card); totalR += inv.pases; }
        else { listPend.appendChild(card); totalP += inv.pases; }
      });

      document.getElementById('metricConf').innerText = totalC + " personas";
      document.getElementById('metricPend').innerText = totalP + " personas";
      document.getElementById('metricExt').innerText = totalE + " personas";
      document.getElementById('metricRej').innerText = totalR + " personas";

      document.getElementById('badgeConf').innerText = listConf.children.length;
      document.getElementById('badgePend').innerText = listPend.children.length;
      document.getElementById('badgeExt').innerText = listExt.children.length;
      document.getElementById('badgeRej').innerText = listRech.children.length;
